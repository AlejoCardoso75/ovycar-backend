spring:
  application:
    name: ovycar
  
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/ovycar_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull}
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASS:Manchas12345.}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: ${PORT:8081}

logging:
  level:
    com.talleres.ovycar: DEBUG
    org.springframework.security: DEBUG