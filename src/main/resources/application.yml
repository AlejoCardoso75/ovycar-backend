spring:
  application:
    name: ovycar

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/ovycar_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull}
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      max-lifetime: 600000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false

server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.talleres.ovycar: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN

jwt:
  secret: ${JWT_SECRET:OvyCarSecretKey2024TalleresOviedoJWTTokenAuthentication}

ovycar:
  bootstrap-secret: ${OVYCAR_BOOTSTRAP_SECRET:}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}
